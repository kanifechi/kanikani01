name: 銘柄判定（毎朝）

# 平日の朝 8:00 JST に実行する。
# GitHub Actions の cron は UTC なので、JST 8:00 = UTC 23:00（前日）。
# JST の月〜金は UTC では日〜木にあたるため 0-4 を指定している。
on:
  schedule:
    - cron: "0 23 * * 0-4"
  workflow_dispatch:      # 手動実行用（Actions タブから実行できる）

# 判定結果の CSV をリポジトリにコミットするために書き込み権限が必要
permissions:
  contents: write

# 実行が重ならないようにする（前回が終わるまで待たずにスキップ）
concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stock_screener/requirements.txt

      - name: 依存ライブラリをインストール
        run: pip install -r stock_screener/requirements.txt

      - name: 銘柄判定を実行
        id: screening
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          mkdir -p stock_screener/results
          # 共有ランナーの IP はレート制限に当たりやすいため、間隔を長めに取る
          python stock_screener/screener.py \
            --interval 3 \
            --output "stock_screener/results/screening_${DATE}.csv"
          cp "stock_screener/results/screening_${DATE}.csv" stock_screener/results/latest.csv

      - name: 判定結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_screener/results/
          if git diff --staged --quiet; then
            echo "変更がないためコミットをスキップします"
          else
            git commit -m "銘柄判定結果 ${{ steps.screening.outputs.date }}"
            git push
          fi

      - name: 結果をアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: screening-${{ steps.screening.outputs.date }}
          path: stock_screener/results/screening_${{ steps.screening.outputs.date }}.csv
          retention-days: 30

      - name: サマリーを表示
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          with open("stock_screener/results/latest.csv", encoding="utf-8-sig") as fp:
              rows = list(csv.DictReader(fp))
          counts = {}
          for row in rows:
              counts[row["judgement"]] = counts.get(row["judgement"], 0) + 1
          print("## 判定結果\n")
          print(" / ".join(f"{k}: {v}件" for k, v in counts.items()) or "対象なし")
          print("\n| コード | 銘柄名 | 判定 | 終値 | RSI | 出来高比 | 理由 |")
          print("| --- | --- | --- | --- | --- | --- | --- |")
          order = {"買い候補": 0, "売り候補": 1, "様子見": 2, "判定不可": 3}
          for row in sorted(rows, key=lambda r: (order.get(r["judgement"], 9), r["code"])):
              print("| {code} | {name} | {judgement} | {close} | {rsi14} | {volume_ratio} | {reason} |".format(**row))
          PY

      - name: 取得失敗を検知
        run: |
          python - <<'PY'
          import csv, sys
          with open("stock_screener/results/latest.csv", encoding="utf-8-sig") as fp:
              rows = list(csv.DictReader(fp))
          failed = [r for r in rows if r["judgement"] == "判定不可"]
          print(f"判定不可: {len(failed)}/{len(rows)} 銘柄")
          # 全銘柄で失敗しているなら yfinance 側の仕様変更やレート制限が疑われるため、
          # ワークフローを失敗させて通知が飛ぶようにする
          if rows and len(failed) == len(rows):
              sys.exit("全銘柄で取得に失敗しました。yfinance の仕様変更・レート制限・銘柄コード誤りの可能性があります。")
          PY
