name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/shikoboard.apk
          ls -l dist/shikoboard.apk
          sha256sum dist/shikoboard.apk

      # 署名・パッケージ名・同梱物が意図どおりかをビルドのたびに確かめる
      - name: Verify APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose dist/shikoboard.apk
          "$BUILD_TOOLS/aapt2" dump badging dist/shikoboard.apk | head -4

          # HTML が改変されず入っているか（ソースとハッシュが一致するか）
          unzip -p dist/shikoboard.apk assets/www/index.html | sha256sum | cut -d' ' -f1 > /tmp/in-apk.sha
          sha256sum android/app/src/main/assets/www/index.html | cut -d' ' -f1 > /tmp/in-src.sha
          diff /tmp/in-apk.sha /tmp/in-src.sha
          echo "bundled HTML matches source: $(cat /tmp/in-apk.sha)"

          # release ビルドは res/raw/*.js のパスを短縮するので、名前ではなく中身で確かめる
          JS_ENTRY="$(unzip -l dist/shikoboard.apk | awk '{print $4}' | grep -E '^res/.*\.js$' | head -1)"
          test -n "$JS_ENTRY"
          unzip -p dist/shikoboard.apk "$JS_ENTRY" | grep -q '__androidDownloadHookInstalled'
          echo "download hook present at $JS_ENTRY"

      - uses: actions/upload-artifact@v4
        with:
          name: shikoboard-apk
          path: dist/shikoboard.apk
          if-no-files-found: error

      # 手動実行、または main への push のときだけ「誰でも落とせるリリース」に載せる。
      # 作業ブランチへの push では成果物（Artifacts）だけ作る。
      - name: Publish to rolling release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view android-latest > /dev/null 2>&1 || \
            gh release create android-latest \
              --title "思考整理ボード Android APK" \
              --notes "最新ビルド。スマホのブラウザでこのページを開いて shikoboard.apk をタップするとインストールできます。"
          gh release upload android-latest dist/shikoboard.apk --clobber
